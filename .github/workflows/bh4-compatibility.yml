name: BH4 read-only compatibility checks

on:
  pull_request:
    paths:
      - 'plugin/**'
      - 'bubbawp.php'
      - 'scripts/bh4_static_audit.py'
      - 'scripts/bh4_hook_inventory.py'
      - 'tests/**'
      - '.github/workflows/bh4-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static PHP source inventory
        run: |
          python3 scripts/bh4_static_audit.py > bh4-static-audit.json
          python3 -m json.tool bh4-static-audit.json > /dev/null
          python3 - <<'PY'
          import json
          with open('bh4-static-audit.json', encoding='utf-8') as f:
              audit = json.load(f)
          print('Scanned PHP source files:', audit['source_files'])
          print('Classes:', audit['class_definitions'])
          print('Duplicate class candidates:', len(audit['duplicate_class_definitions']))
          print('Shortcodes:', len(audit['shortcodes']))
          print('Potential schema files:', len(audit['potential_schema_change_files']))
          for name, paths in sorted(audit['duplicate_class_definitions'].items()):
              print('DUPLICATE_CLASS', name, '::', ', '.join(paths))
          for path in audit['potential_schema_change_files']:
              print('SCHEMA_REVIEW', path)
          PY
      - name: Source-only hooks and scheduled jobs inventory
        run: |
          python3 scripts/bh4_hook_inventory.py > bh4-hook-inventory.json
          python3 -m json.tool bh4-hook-inventory.json > /dev/null
          python3 - <<'PY'
          import json
          data = json.load(open('bh4-hook-inventory.json', encoding='utf-8'))
          for category, matches in sorted(data['categories'].items()):
              print(category, len(matches))
          PY
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: bh4-static-audit
          path: |
            bh4-static-audit.json
            bh4-hook-inventory.json
          retention-days: 7
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax checks
        run: |
          php -l bubbawp.php
          find plugin tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Isolated BH4 session mapping fixtures
        run: php tests/bh4-session-mapping-test.php
      - name: Isolated BH4 recurring session fixtures
        run: php tests/bh4-recurrence-fixtures-test.php
      - name: Isolated BH4 checkout ownership fixtures
        run: php tests/bh4-checkout-ownership-test.php
      - name: Source-only checkout hook and webhook guardrails
        run: php tests/bh4-checkout-hook-contract-test.php
      - name: Isolated Stripe webhook retry decisions
        run: php tests/bh4-stripe-webhook-retry-contract-test.php
      - name: Static Stripe reconciliation ordering guard
        run: php tests/bh4-stripe-webhook-reconciliation-source-test.php
      - name: Configured checkout form compatibility guard
        run: php tests/bh4-form-7-8-compatibility-test.php
      - name: Isolated multi-attendee and capacity fixtures
        run: php tests/bh4-multi-attendee-selection-test.php
      - name: Combined booking fee and hold expiry source guard
        run: php tests/bh4-fee-and-expiry-source-test.php
      - name: Isolated reservation expiry decisions
        run: php tests/bh4-reservation-expiry-contract-test.php
      - name: Read-only expiry candidate planner fixtures
